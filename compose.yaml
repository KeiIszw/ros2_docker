name: operasim-ros2

services:
  ros2:
    image: operasim-ros2:humble
    build:
      context: .
      args:
        USER_UID: ${LOCAL_UID:-1000}
        USER_GID: ${LOCAL_GID:-1000}
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    ports:
      - "127.0.0.1:${ROS_TCP_PORT:-10000}:10000"
    volumes:
      - ${ROS2_WS:-/home/iszw/ros2_ws}:/home/ros/ros2_ws
    working_dir: /home/ros/ros2_ws
    command:
      - ros2
      - run
      - ros_tcp_endpoint
      - default_server_endpoint
      - --ros-args
      - -p
      - ROS_IP:=0.0.0.0
      - -p
      - ROS_TCP_PORT:=10000

